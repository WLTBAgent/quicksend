services:
  quicksend:
    build: .
    environment:
      - QUICKSEND_ADDR=:8080
      - QUICKSEND_DATA_DIR=/data
    volumes:
      - quicksend-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${QUICKSEND_DOMAIN:-localhost}
      - EMAIL=${QUICKSEND_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - quicksend

volumes:
  quicksend-data:
  caddy-data:
  caddy-config:
